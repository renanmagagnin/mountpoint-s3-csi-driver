apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-eviction-test
spec:
  capacity:
    storage: 1200Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  claimRef:
    namespace: mp-eviction-test
    name: s3-pvc-eviction-test
  mountOptions:
    - allow-delete
    - region us-west-2
  csi:
    driver: s3.csi.aws.com
    volumeHandle: s3-csi-eviction-test-volume
    volumeAttributes:
      bucketName: mp-cache-test-1768923452
      cache: emptyDir
      cacheEmptyDirSizeLimit: 50Mi  # Intentionally small to trigger eviction
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-pvc-eviction-test
  namespace: mp-eviction-test
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1200Gi
  volumeName: s3-pv-eviction-test
